[project]
name = "portfolio-rag"
version = "0.1.0"
description = "Chatbot RAG du portfolio lahely.fr"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "sentence-transformers>=5.0",
    "torch>=2.5",
]

[tool.uv]
package = false

# Sur Linux (le VPS, sans GPU) : torch en version CPU, ~10x plus léger que la
# version CUDA par défaut. Sur macOS, le torch standard est déjà sans CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
