# Sur le VPS : ~/apps/portfolio (clone de ce dépôt). Lancé par deploy.sh.
services:
  portfolio-rag:
    build: .
    image: portfolio-rag
    container_name: portfolio-rag
    restart: unless-stopped
    # ANTHROPIC_API_KEY : fichier présent uniquement sur le serveur (ignoré par git)
    env_file: ./api.env
    # aucune section ports : Caddy joint l'API par le réseau web (portfolio-rag:8000)
    networks:
      - web
    mem_limit: 1536m
    # Durcissement, comme les autres conteneurs du VPS : aucune capacité Linux (l'API n'écoute
    # que sur le port 8000 et n'écrit nulle part), pas d'élévation de privilèges possible,
    # et un plafond de processus (13 en temps normal) contre un emballement.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

networks:
  web:
    external: true
