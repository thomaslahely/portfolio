<!-- Source de public/og.png, l'image des aperçus de liens (balise og:image, 1200 × 630).
     Régénérer après une modification :
       rsvg-convert -w 1200 -h 630 src/og.svg -o public/og.png     (brew install librsvg)
     Les réseaux sociaux n'acceptent pas le SVG : c'est le PNG qui est publié. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#fbfbfa"/>
  <rect width="1200" height="14" fill="#2f5bd3"/>
  <rect x="90" y="96" width="92" height="92" rx="20" fill="#2f5bd3"/>
  <text x="136" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">TL</text>
  <text x="90" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#1d1d1f">Thomas Lahely</text>
  <text x="90" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#1d1d1f">Étudiant en Master 2 Informatique, parcours IA</text>
  <text x="90" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#5f6368">Projets, notes techniques et assistant qui répond à vos questions</text>
  <text x="90" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2f5bd3">lahely.fr</text>
</svg>
